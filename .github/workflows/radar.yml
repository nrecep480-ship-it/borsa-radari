name: Borsa Radari Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoriyi Cek
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser yfinance

      - name: Botu Calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
