name: Borsa Radari Runner

on:
  schedule:
    - cron: '*/1 * * * *'  # Her 1 dakikada bir otomatik çalışır
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Borsa Botunu Calistir
        run: python main.py
