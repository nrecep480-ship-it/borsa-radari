name: Borsa Radari Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoriyi Cek
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutupxaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 30 Saniyelik Dongu Ile Radari Calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END_TIME=$((SECONDS + 300))
          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- Radar Taraniyor: $(date) ---"
            python main.py || true
            sleep 30
          done
